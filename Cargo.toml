[package]
name = "snake-bollada"
version = "0.1.0"
edition = "2021"
authors = ["Luigi de Menezes Collesi"]
homepage = "https://play.battlesnake.com"
repository = "https://github.com/luigicollesi/SnakeBollada"
readme = "README.md"
keywords = ["battlesnake", "rust"]
description = "SnakeBollada - a Battlesnake written in Rust"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
