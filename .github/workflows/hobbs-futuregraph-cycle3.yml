name: Hobbs FutureGraph Cycle 3

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/hobbs-futuregraph-cycle3.yml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SnakeBollada
        uses: actions/checkout@v4

      - name: Record environment
        run: |
          git rev-parse HEAD | tee snakebollada-commit.txt
          echo "runner_name=${RUNNER_NAME}" | tee runner-info.txt
          echo "runner_os=${RUNNER_OS}" >> runner-info.txt
          echo "runner_arch=${RUNNER_ARCH}" >> runner-info.txt

      - name: Build SnakeBollada
        run: docker build -t snakebollada:simulation .

      - name: Checkout Hovering Hobbs
        run: |
          mkdir -p /tmp/battlesnake-rs
          git -C /tmp/battlesnake-rs init
          git -C /tmp/battlesnake-rs remote add origin https://github.com/coreyja/battlesnake-rs.git
          git -C /tmp/battlesnake-rs fetch --depth 1 origin 3775c70676a4add680a19eb810c196d1e4820665
          git -C /tmp/battlesnake-rs checkout --detach FETCH_HEAD
          git -C /tmp/battlesnake-rs rev-parse HEAD | tee hobbs-commit.txt

      - name: Build Hovering Hobbs
        run: docker build -t hovering-hobbs:simulation /tmp/battlesnake-rs

      - name: Start both snakes
        run: |
          docker run -d --name snakebollada \
            -p 8000:8000 \
            -e RUST_LOG="info,opponent_intent=debug" \
            snakebollada:simulation

          docker run -d --name hovering-hobbs \
            -p 8001:8000 \
            hovering-hobbs:simulation

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null \
              && curl -fsS http://127.0.0.1:8001/hovering-hobbs >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs snakebollada || true
          docker logs hovering-hobbs || true
          exit 1

      - name: Install Battlesnake CLI
        run: |
          go install github.com/BattlesnakeOfficial/rules/cli/battlesnake@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run deterministic duel
        run: |
          set +e
          battlesnake play \
            --width 11 \
            --height 11 \
            --name "SnakeBollada" \
            --url http://127.0.0.1:8000 \
            --name "Hovering Hobbs" \
            --url http://127.0.0.1:8001/hovering-hobbs \
            --timeout 500 \
            --gametype standard \
            --map standard \
            --seed 20261002 \
            --output game.jsonl \
            --viewmap \
            2>&1 | tee game-console.log
          status=${PIPESTATUS[0]}
          echo "battlesnake_exit_code=${status}" | tee simulation-status.txt
          exit 0

      - name: Collect logs
        if: always()
        run: |
          docker logs snakebollada > snakebollada.log 2>&1 || true
          docker logs hovering-hobbs > hovering-hobbs.log 2>&1 || true

      - name: Generate decision trace
        if: always()
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          move_re = re.compile(
              r"MOVE (?P<turn>\d+): (?P<move>\w+) .*?"
              r"depth=(?P<depth>\d+).*?"
              r"completed_depth=(?P<completed_depth>\d+).*?"
              r"beam_value=(?P<beam>-?\d+).*?"
              r"forecast_provisional=(?P<provisional>true|false).*?"
              r"terminal_confirmed=(?P<terminal_confirmed>true|false).*?"
              r"ours_food=(?P<food>-?\d+) .*?"
              r"ours_hunt=(?P<hunt>-?\d+) .*?"
              r"ours_survival=(?P<survival>-?\d+) .*?"
              r"ours_terminal=(?P<terminal>-?\d+)"
          )
          intent_re = re.compile(
              r"enemy=(?P<enemy>\S+) observed=(?P<observed>\w+).*?"
              r"food_bias=(?P<food_bias>\d+).*?"
              r"hunting_bias=(?P<hunting_bias>\d+).*?"
              r"trapping_bias=(?P<trapping_bias>\d+).*?"
              r"head_threat_bias=(?P<head_bias>\d+)"
          )

          moves = []
          log = Path("snakebollada.log")
          if log.exists():
              for line in log.read_text(errors="replace").splitlines():
                  m = move_re.search(line)
                  if m:
                      row = m.groupdict()
                      for k in ("turn","depth","completed_depth","beam","food","hunt","survival","terminal"):
                          row[k] = int(row[k])
                      row["provisional"] = row["provisional"] == "true"
                      row["terminal_confirmed"] = row["terminal_confirmed"] == "true"
                      moves.append(row)

          states = []
          gp = Path("game.jsonl")
          if gp.exists():
              for line in gp.read_text(errors="replace").splitlines():
                  try:
                      states.append(json.loads(line))
                  except Exception:
                      pass

          def snake_by_name(state, name):
              return next((s for s in state.get("board",{}).get("snakes",[]) if s.get("name")==name), None)

          state_by_turn = {s.get("turn"): s for s in states if isinstance(s, dict) and "turn" in s}
          previous_lengths = {}
          rows = []
          for mv in moves:
              t = mv["turn"]
              st = state_by_turn.get(t)
              ours = snake_by_name(st, "SnakeBollada") if st else None
              hobbs = snake_by_name(st, "Hovering Hobbs") if st else None
              food = st.get("board",{}).get("food",[]) if st else []
              head = ours.get("head") if ours else None
              dist = None
              if head and food:
                  dist = min(abs(head["x"]-f["x"])+abs(head["y"]-f["y"]) for f in food)
              row = {
                  **mv,
                  "ours_len": ours.get("length") if ours else None,
                  "hobbs_len": hobbs.get("length") if hobbs else None,
                  "ours_health": ours.get("health") if ours else None,
                  "hobbs_health": hobbs.get("health") if hobbs else None,
                  "head": head,
                  "nearest_food": dist,
              }
              rows.append(row)

          Path("decision-trace.json").write_text(json.dumps(rows, indent=2))
          with Path("decision-trace.txt").open("w") as out:
              for r in rows:
                  out.write(
                      f"turn={r['turn']:>3} move={r['move']:<5} "
                      f"len={r['ours_len']}/{r['hobbs_len']} "
                      f"health={r['ours_health']} food_dist={r['nearest_food']} "
                      f"depth={r['depth']}/{r['completed_depth']} beam={r['beam']} "
                      f"provisional={r['provisional']} confirmed={r['terminal_confirmed']} "
                      f"U(food/hunt/surv/term)={r['food']}/{r['hunt']}/{r['survival']}/{r['terminal']}\n"
                  )

          intents = []
          if log.exists():
              for line in log.read_text(errors="replace").splitlines():
                  m = intent_re.search(line)
                  if m:
                      d=m.groupdict()
                      for k in ("food_bias","hunting_bias","trapping_bias","head_bias"):
                          d[k]=int(d[k])
                      intents.append(d)
          Path("intent-trace.json").write_text(json.dumps(intents, indent=2))

          print(f"moves={len(rows)}")
          print(f"states={len(states)}")
          if rows:
              first_growth = next((r["turn"] for r in rows if r["ours_len"] and r["ours_len"] > rows[0]["ours_len"]), None)
              smaller_turns = sum(1 for r in rows if r["ours_len"] is not None and r["hobbs_len"] is not None and r["ours_len"] < r["hobbs_len"])
              equal_turns = sum(1 for r in rows if r["ours_len"] is not None and r["hobbs_len"] is not None and r["ours_len"] == r["hobbs_len"])
              larger_turns = sum(1 for r in rows if r["ours_len"] is not None and r["hobbs_len"] is not None and r["ours_len"] > r["hobbs_len"])
              print(f"first_growth_turn={first_growth}")
              print(f"size_relation_turns smaller={smaller_turns} equal={equal_turns} larger={larger_turns}")
              print(f"max_ours_length={max(r['ours_len'] or 0 for r in rows)}")
              print(f"max_hobbs_length={max(r['hobbs_len'] or 0 for r in rows)}")
          PY
          python3 - <<'PY' > simulation-summary.txt
          import json
          from pathlib import Path

          states=[]
          p=Path("game.jsonl")
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  try: states.append(json.loads(line))
                  except: pass
          print(f"states={len(states)}")
          if states:
              print(f"first_turn={states[0].get('turn')}")
              print(f"last_turn={states[-1].get('turn')}")
              print("last_state_survivors=" + ",".join(s.get("name","?") for s in states[-1].get("board",{}).get("snakes",[])))
          trace=Path("decision-trace.json")
          if trace.exists():
              rows=json.loads(trace.read_text())
              if rows:
                  print(f"moves={len(rows)}")
                  print(f"max_ours_length={max(r.get('ours_len') or 0 for r in rows)}")
                  print(f"max_hobbs_length={max(r.get('hobbs_len') or 0 for r in rows)}")
                  print(f"first_growth_turn={next((r['turn'] for r in rows if (r.get('ours_len') or 0)>(rows[0].get('ours_len') or 0)), 'none')}")
          PY
          cat simulation-summary.txt
          echo "--- decision trace ---"
          cat decision-trace.txt || true

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hobbs-futuregraph-cycle3-20261004
          path: |
            game.jsonl
            game-console.log
            snakebollada.log
            hovering-hobbs.log
            simulation-summary.txt
            simulation-status.txt
            decision-trace.json
            decision-trace.txt
            intent-trace.json
            snakebollada-commit.txt
            hobbs-commit.txt
            runner-info.txt
          if-no-files-found: warn
