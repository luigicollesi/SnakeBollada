name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        # Time-budgeted search tests require isolated CPU time to avoid flaky depth changes.
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Build release
        run: cargo build --release
