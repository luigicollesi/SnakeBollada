name: Maua V3 port preflight
on:
  push:
    branches: [dev]
    paths:
      - scripts/prepare_maua_v3_port.py
      - scripts/tune_maua_v3_lambda.py
      - docs/migrations/maua-ordering-v3-lambda.md
      - .github/workflows/maua-v3-port-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate migration script syntax
        run: python3 -m py_compile scripts/prepare_maua_v3_port.py
      - name: Validate command-line interface
        run: python3 scripts/prepare_maua_v3_port.py --help
      - name: Verify deployment guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BRANCH = "feature/ordering-v3-lambda-port"' scripts/prepare_maua_v3_port.py
          grep -Fq 'git", "switch", "-c", BRANCH, "origin/dev"' scripts/prepare_maua_v3_port.py
          grep -Fq 'SNAKE_TERRITORY_MODE' scripts/prepare_maua_v3_port.py

      - name: Install Rust for offline port compilation
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Checkout deployed Maua V3 into an isolated local branch
        run: |
          git clone https://github.com/Maua-Dev/battlesnake_luigi.git ../battlesnake_luigi
          cd ../battlesnake_luigi
          git switch -c fix/v3-lambda-256mb-local-preflight
          git log -1 --oneline

      - name: Validate Lambda code-only CPU-safety adaptations
        run: |
          set -euo pipefail
          cd ../battlesnake_luigi
          python3 ../SnakeBollada/scripts/tune_maua_v3_lambda.py .
          cargo fmt --all
          cargo test --locked --all-features
          cargo build --locked --release
          test "$(git status --porcelain terraform/app/main.tf | wc -l)" -eq 0
